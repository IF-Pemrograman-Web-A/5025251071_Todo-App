<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piw's To-do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Piw's To-do List</h1>
        <button id="theme-toggle-btn">Dark Mode</button>
    </header>

    <main class="container">
        
        <!-- Left panel: List -->
        <section class="left-panel">
            <h2>List Task</h2>
            
            <form id="add-todo-form" class="todo-form">
                <h3>New To-do</h3>
                <input type="text" id="input-title" placeholder="Task title..." required>
                <textarea id="input-desc" placeholder="Description..."></textarea>
                <button type="submit">Add</button>
            </form>

            <ul id="todo-list" class="todo-list">
            </ul>
        </section>

        <!-- Right panel: Editor/detail Todo -->
        <aside class="right-panel">
            <h2>Detail Todo</h2>
            
            <form id="edit-todo-form" class="editor-form">

                <input type="hidden" id="edit-id">

                <label for="edit-title">Title:</label>
                <input type="text" id="edit-title">

                <label for="edit-desc">Description:</label>
                <textarea id="edit-desc" rows="5"></textarea>

                <label for="edit-status">Status:</label>
                <select id="edit-status">
                    <option value="Unfinished">Unfinished</option>
                    <option value="On progress">In progress</option>
                    <option value="Done!">Done!</option>
                </select>

                <div class="editor-buttons">
                    <button type="submit" class="btn-save">Yes</button>
                    <button type="button" id="btn-delete-editor" class="btn-delete">Delete</button>
                </div>
            </form>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Todo App - Nasywa Zhafirah</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
