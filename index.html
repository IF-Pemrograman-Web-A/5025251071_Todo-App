<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>To-do List App</h1>
    </header>

    <main class="container">
        
        <!-- Left panel: List -->
        <section class="left-panel">
            <h2>List Task</h2>
            
            <!-- Form for new todo -->
            <form class="todo-form">
                <h3>New To-do</h3>
                <input type="text" placeholder="Task title..." required>
                <textarea placeholder="Description..."></textarea>
                <button type="submit">Add</button>
            </form>

            <!-- Static Todo List (Dummy Data) -->
            <ul class="todo-list">
                <li class="todo-item active">
                    <h4>Tugas Pemrograman Web</h4>
                    <p>Bikin website sederhana pake html dan css</p>
                </li>
                <li class="todo-item">
                    <h4>Nyuci baju</h4>
                </li>
                <li class="todo-item">
                    <h4>Beli keperluan yang abis</h4>
                    <p>Sabun cuci baju, sunscreen</p>
                </li>
            </ul>
        </section>

        <!-- Right panel: Editor/detail Todo -->
        <aside class="right-panel">
            <h2>Detail Todo</h2>
            <form class="editor-form">
                <label for="edit-title">Title:</label>
                <input type="text" id="edit-title" value="Tugas Pemrograman Web">

                <label for="edit-desc">Description:</label>
                <textarea id="edit-desc" rows="5">Bikin website sederhana pake html dan css</textarea>

                <label for="edit-status">Status:</label>
                <select id="edit-status">
                    <option value="pending">Unfinished</option>
                    <option value="pending">On progress</option>
                    <option value="done">Done!</option>
                </select>

                <button type="button" class="btn-save">Yup, save!</button>
                <button type="button" class="btn-delete">Delete</button>
            </form>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Todo App - Nasywa Zhafirah</p>
    </footer>

</body>
</html>
